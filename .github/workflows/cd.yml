name: CD

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.set-profile.outputs.profile }}
      tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set profile
        id: set-profile
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "profile=prod" >> $GITHUB_OUTPUT
          else
            echo "profile=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}
          TAG=${{ steps.set-tag.outputs.tag }}

          docker buildx build \
            -f docker/Dockerfile \
            -t ${IMAGE}:${TAG} \
            --push .

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        env:
          PROFILE: ${{ needs.build.outputs.profile }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          REDIS_PASS: ${{ secrets.REDIS_PASS }}
        run: |
          set -e

          mkdir -p docker

          printf "%s" "$ENV_FILE" > docker/.env
          echo "" >> docker/.env

          echo "PROFILE=${PROFILE}" >> docker/.env
          echo "IMAGE_TAG=${IMAGE_TAG}" >> docker/.env
          echo "DOCKER_USERNAME=${DOCKER_USERNAME}" >> docker/.env
          echo "DOCKER_REPO=${DOCKER_REPO}" >> docker/.env
          echo "REDIS_PASS=${REDIS_PASS}" >> docker/.env

          docker compose -f docker/docker-compose.yml --env-file docker/.env down
          docker compose -f docker/docker-compose.yml --env-file docker/.env pull
          docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
